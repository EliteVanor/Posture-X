<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostureX Register</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/monitor.css">
</head>
<body class="auth-container">
    <main class="auth-box">
        <h2>Register</h2>
        <form id="registerForm">
            <input type="text" id="full_name" placeholder="Full Name" aria-label="Full name" autocomplete="name" required>
            <input type="email" id="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
            <input type="password" id="password" placeholder="Password" aria-label="Password" autocomplete="new-password" required>
            <input type="number" id="age" placeholder="Age" aria-label="Age" min="1" max="120" required>
            <select id="gender" aria-label="Gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <input type="text" id="country" placeholder="Country" aria-label="Country" autocomplete="country-name" required>
            <button type="submit">Register</button>
        </form>
        <p id="auth-message" class="notice" role="status" hidden></p>
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
